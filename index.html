<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlockPass | Anti-Scalping Ticketing dApp</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            background: #fff;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
        }
        p.subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 30px;
        }
        .card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #e9ecef;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        label {
            font-weight: bold;
            color: #34495e;
        }
        #status {
            font-weight: bold;
            color: #e67e22;
        }
    </style>
</head>
<body>

    <h1>BlockPass Ticket Portal</h1>
    <p class="subtitle">Decentralized Anti-Scalping Event Access</p>

    <!-- Wallet Connection Section -->
    <div class="card">
        <h3>Wallet Status</h3>
        <p>Current State: <span id="status">Disconnected</span></p>
        <button onclick="connectWallet()">Connect MetaMask</button>
    </div>

    <!-- Purchase Section -->
    <div class="card">
        <h3>Buy Ticket</h3>
        <label for="listingId">Listing ID:</label>
        <input type="number" id="listingId" placeholder="e.g. 1" value="1">
        
        <p style="font-size: 14px; color: #555;">Price: <strong>0.01 ETH / MATIC</strong></p>
        <button onclick="buyTicket()">Secure Ticket On-Chain</button>
    </div>

    <!-- Web3.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/web3@4.16.0/dist/web3.min.js"></script>
    <!-- Your Custom Bridge Logic -->
    <script src="app.js"></script>
</body>
</html>
